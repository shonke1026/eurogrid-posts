<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
/* リール・TikTok の型 1080×1920、30fps。フレーム番号から画面を決める（Remotion と同じ考え方。2026-11-14 試作から）。写真・映像は使わない
   使い方：このファイルを posts/<フォルダ>/reel.html にコピーし、4つの場面の文と、下の S（場面の秒）・CAP（字幕）を書きかえる
   書き出し：python3 templates/render_reel.py posts/<フォルダ>/reel.html posts/<フォルダ>/reel.mp4
   ?guide を付けて開くと安全な範囲（上下285pxを除く中央）を表示。字幕と大事な文字はその中、右下は空ける
   1場面目は結論（デザイン仕様 v1.1 の表紙と同じ）。結果にふれる24時間以内は、1場面目に結果を出さない（CLAUDE.md の5） */
body{width:1080px;height:1920px;position:relative;--pad:72px}
.s{position:absolute;inset:0;opacity:0}
.kicker{top:330px}
.band{position:absolute;left:0;right:0;top:285px;height:16px;background:linear-gradient(90deg,var(--es) 0 50%,var(--it) 50%)}
.over{position:absolute;left:72px;right:160px;top:430px;font-size:40px;color:var(--sub);font-weight:700}
.big{position:absolute;left:72px;right:140px;top:500px;font-size:104px;line-height:1.2}
.big em{font-style:normal;color:var(--es2)}
.fact{position:absolute;left:72px;right:140px;top:470px}
.fact .q{font-size:76px;line-height:1.3}.fact .q::before{content:"「";}.fact .q::after{content:"」"}
.fact .who{font-size:34px;color:var(--sub);margin-top:24px;font-weight:700}
.chips{display:flex;gap:20px;margin-top:56px;flex-wrap:wrap}.chips span{font-size:44px;font-weight:900;padding:14px 26px;border:4px solid var(--text)}
.chips span.x{border-color:var(--es);color:var(--es)}
.nums{position:absolute;left:72px;right:140px;top:1010px;display:flex;align-items:flex-end;gap:24px}
.nums .v{font-family:Anton,sans-serif;font-size:220px;line-height:.9;color:var(--es2)}.nums .l{font-size:40px;font-weight:900;padding-bottom:20px}
.duo{position:absolute;left:0;right:0;top:400px;height:760px;display:flex}
.duo>div{flex:1;padding:56px 44px;display:flex;flex-direction:column}
.duo .es{background:var(--es)}.duo .it{background:var(--it)}
.duo .who{font-size:36px;font-weight:900;line-height:1.4}.duo .t{font-size:62px;line-height:1.3;margin-top:auto;margin-bottom:auto}
.view{position:absolute;left:72px;right:140px;top:420px}
.view .lab{font-size:38px;color:var(--sub);font-weight:900;letter-spacing:.15em}
.view .t{font-size:80px;line-height:1.28;margin-top:26px}.view .logo2{position:static;font-size:44px;margin-top:22px}
.view .src{font-size:28px;color:var(--sub);margin-top:34px;line-height:1.5}
.logo{position:absolute;left:72px;top:1180px;font-size:48px}
/* 字幕：安全な範囲（上下285pxを除く中央）の下のほう。右下はUIが重なるので右を空ける */
.cap{position:absolute;left:72px;right:180px;top:1290px;font-size:46px;font-weight:900;line-height:1.45;background:rgba(0,0,0,.72);padding:18px 26px;border-left:10px solid var(--text)}
.guide .safe{position:absolute;left:0;right:0;top:285px;height:1350px;outline:4px dashed #0f0}
</style></head><body>
<div class="band" id="band"></div>
<div class="kicker" data-k="比較" id="kick">比較</div>

<div class="s" id="s1"><div class="over">〇〇選手｜話題の一言</div><div class="h big">結論の一文を<br><em>大きく</em><br>3行まで</div></div>

<div class="s" id="s2"><div class="fact"><div class="h q">本人の言葉を短く</div><div class="who">だれの言葉か（媒体名）</div>
 <div class="chips"><span class="x">要点1</span><span class="x">要点2</span><span>要点3</span></div></div>
</div>

<div class="s" id="s3"><div class="duo"><div class="es"><div class="who">スペイン<br>媒体名</div><div class="h t">スペイン側の<br>書き方</div></div><div class="it"><div class="who">イタリア<br>媒体名</div><div class="h t">イタリア側の<br>書き方</div></div></div></div>

<div class="s" id="s4"><div class="view"><div class="lab">EUROGRIDの見方</div><div class="h t">Eurogridの<br>見方を<br>短く</div>
 <div class="src">出典：媒体名（日付）、媒体名（日付）　PRではありません</div><div class="logo logo2"><span class="mark"><i></i><i></i></span>Eurogrid</div></div></div>

<div class="cap" id="cap"></div>
<div class="safe"></div>
<script>
const FPS=30, DUR=18*FPS;
// 場面：開始・終了（秒）
const S=[[0,3.6],[3.6,8.6],[8.6,13.4],[13.4,18]];
const CAP=[[0,3.6,"字幕1：結論"],
 [3.6,6.2,"字幕2：本人の言葉"],
 [6.2,8.6,"字幕3：要点"],
 [8.6,11,"字幕4：スペイン側"],
 [11,13.4,"字幕5：イタリア側"],
 [13.4,18,"字幕6：Eurogridの見方"]];
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
function setFrame(f){
  const t=f/FPS;
  S.forEach(([a,b],i)=>{
    const el=document.getElementById('s'+(i+1));
    const fin=ease((t-a)/0.35), fout=i<S.length-1?ease((t-(b-0.25))/0.25):0;
    const on=t>=a-0.01&&t<b+0.3;
    const o=on?Math.max(0,fin-fout):0;
    el.style.opacity=o;
    el.style.transform=`translateY(${(1-fin)*40}px)`;
  });
  // 表紙の数字・チップのあらわれ方
  const s2=t-S[1][0];
  document.querySelectorAll('#s2 .chips span').forEach((c,k)=>{const p=ease((s2-0.8-k*0.35)/0.3);c.style.opacity=p;c.style.transform=`scale(${0.85+0.15*p})`});
  
  const s3=t-S[2][0];
  document.querySelector('#s3 .es').style.transform=`translateX(${-(1-ease(s3/0.45))*540}px)`;
  document.querySelector('#s3 .it').style.transform=`translateX(${(1-ease((s3-0.25)/0.45))*540}px)`;
  const c=CAP.find(([a,b])=>t>=a&&t<b)||CAP[CAP.length-1];
  const cap=document.getElementById('cap');cap.textContent=c[2];
  const ct=t-c[0];cap.style.opacity=ease(ct/0.2);
}
window.setFrame=setFrame;window.DUR=DUR;
if(location.search.includes('guide'))document.body.classList.add('guide');
setFrame(0);
</script></body></html>
