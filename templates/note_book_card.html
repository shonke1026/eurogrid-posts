<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:670px;background:#0d1522;font-family:"Noto Sans CJK JP",sans-serif;color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.wrap{position:absolute;inset:64px 80px 56px;display:flex;gap:64px}
.book{width:300px;flex:none;position:relative;margin-top:22px}
.spine{position:absolute;inset:0;border-radius:6px 14px 14px 6px;background:#f2eee6;box-shadow:16px 18px 0 rgba(245,179,1,.9);overflow:hidden}
.spine:before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;background:#d9d3c7}
.spine .t{position:absolute;left:48px;right:28px;top:56px;color:#0d1522;font-weight:900;font-size:34px;line-height:1.35}
.spine .a{position:absolute;left:48px;bottom:48px;color:#5b6474;font-size:20px;font-weight:700}
.spine .ln{position:absolute;left:48px;right:28px;top:250px;height:4px;background:#f5b301}
.book{height:440px}
.txt{flex:1;display:flex;flex-direction:column}
.tag{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;letter-spacing:.14em;color:#f5b301}
.tag .bar{width:44px;height:4px;background:#f5b301}
.pr{margin-left:auto;font-size:16px;letter-spacing:.1em;color:#8d9bb0;border:1.5px solid #4a5568;border-radius:4px;padding:3px 10px}
h1{margin-top:22px;font-size:52px;font-weight:900;line-height:1.25}
.by{margin-top:14px;font-size:24px;color:#c8d1de}
.pt{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.pt div{font-size:26px;line-height:1.5;padding-left:26px;position:relative;color:#e6ebf2}
.pt div:before{content:"";position:absolute;left:0;top:15px;width:12px;height:12px;background:#f5b301}
.pt b{color:#fff}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.btn{background:#f5b301;color:#0d1522;font-weight:900;font-size:26px;padding:14px 30px;border-radius:8px}
.btn small{font-weight:700;font-size:18px;margin-left:10px}
.logo{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700}
.mark{display:flex;gap:5px}.mark i{display:block;width:20px;height:24px;border:5px solid #fff;border-bottom:none}.mark i+i{border-color:#f5b301;margin-top:6px}
</style></head><body><div class="grid"></div>
<div class="wrap">
 <div class="book"><div class="spine"><div class="t">MotoGP<br>最速ライダー<br>の肖像</div><div class="ln"></div><div class="a">西村章</div></div></div>
 <div class="txt">
  <div class="tag"><span class="bar"></span>この回の一冊<span class="pr">PR</span></div>
  <h1>『MotoGP<br>最速ライダーの肖像』</h1>
  <div class="by">西村章（集英社新書、2021年）</div>
  <div class="pt">
   <div>約20年の取材で描いた<b>トップライダー12人</b>の素顔</div>
   <div><b>マルケス選手の章（第5章）</b>あり。王者決定の前に</div>
   <div>加藤大治郎選手、玉田誠選手ら<b>日本人ライダー</b>の章も</div>
  </div>
  <div class="foot"><div class="btn">Amazonで見る<small>新書 1,034円（11/10時点）</small></div><div class="logo"><span class="mark"><i></i><i></i></span>Eurogrid</div></div>
 </div>
</div></body></html>
