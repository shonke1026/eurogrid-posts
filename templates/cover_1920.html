<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>

   載せるのはキッカーと1行のフック（1行10文字まで×2行）だけ。細かい説明は入れない（2026-11-14 デザイン仕様 v1）。
   ?guide を付けて開くと安全な範囲を表示（書き出すときは外す） */

.safe{position:absolute;left:0;right:0;top:285px;height:1350px}
.kicker{top:357px}

.vs{position:absolute;left:72px;top:860px;display:flex;gap:20px;font-size:40px;font-weight:900}.vs span{padding:10px 22px}.vs .a{background:var(--es)}.vs .b{background:var(--it)}
.logo{position:absolute;left:72px;top:1000px;font-size:38px}
.guide .safe{outline:4px dashed #0f0}.guide .low{position:absolute;left:0;right:0;bottom:0;height:640px;background:rgba(255,0,0,.15)}
</style></head><body><div class="safe"></div><div class="low"></div>

</body></html>
