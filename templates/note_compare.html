<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
body{width:1280px;height:960px;position:relative;--pad:56px}
h1{position:absolute;left:56px;right:56px;top:130px;font-size:52px}
.cols{position:absolute;left:56px;right:56px;top:250px;height:470px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.col{padding:34px 34px;background:rgba(255,255,255,.04);position:relative}
.col .bar{position:absolute;left:0;top:0;right:0;height:10px}
.col h2{font-size:30px;font-weight:900;margin-top:6px}.col .src{font-size:20px;color:var(--sub);margin-top:6px}
.col p{font-size:28px;line-height:1.6;margin-top:22px}
.diff{position:absolute;left:56px;right:56px;top:750px;padding:26px 30px;border-left:8px solid var(--text);font-size:28px;line-height:1.55}
.diff b{font-weight:900}
.foot{position:absolute;left:56px;right:56px;bottom:40px;display:flex;justify-content:space-between}.logo{font-size:24px}.handle{font-size:22px}
</style></head><body>
<div class="kicker" data-k="比較">比較</div>
<h1 class="h">同じ結果、ちがう主役</h1>
<div class="cols">
 <div class="col"><div class="bar bar-es"></div><h2 class="side-es">スペイン</h2><div class="src">Marca ほか</div><p>主役は7位のマルティン。痛みを抱えて王者決定を止めた側を書いた。</p></div>
 <div class="col"><div class="bar bar-it"></div><h2 class="side-it">イタリア</h2><div class="src">GPOne ほか</div><p>勝ったベッツェッキより、メーカー部門の争いと使われなかった祝賀ステージ。</p></div>
</div>
<div class="diff"><b>ちがい：</b>スペインは「次の土曜」、イタリアは「幻の日曜」を見ている。</div>
<div class="foot"><div class="logo"><span class="mark"><i></i><i></i></span>Eurogrid</div><div class="handle">note.com/eurogrid_jp</div></div>
</body></html>
