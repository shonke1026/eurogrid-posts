<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
/* 結果型 1080×1350：1位だけ大きく、2〜10位は同じ高さの行 */
body{width:1080px;height:1350px;position:relative;--pad:72px}
.n{position:absolute;right:72px;top:80px;font-size:30px;color:var(--sub)}
.title{position:absolute;left:72px;top:170px;font-size:44px}
.p1{position:absolute;left:72px;right:72px;top:250px;height:230px;background:rgba(255,255,255,.05);display:flex;align-items:center;gap:36px;padding:0 40px}
.p1 .num{font-size:150px;line-height:1}.p1 .nm{font-size:56px;font-weight:900}.p1 .tm{font-size:28px;color:var(--sub);margin-top:6px}.p1 .pt{margin-left:auto;font-size:64px}
.rows{position:absolute;left:72px;right:72px;top:510px}
.row{height:68px;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--line);font-size:32px}
.row .num{width:56px;font-size:36px;color:var(--sub)}.row .nm{font-weight:700}.row .pt{margin-left:auto}.row.jp .nm::after{content:"  日本";font-size:22px;color:var(--es2)}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:34px}.src{font-size:24px;color:var(--sub)}
</style></head><body>
<div class="kicker" data-k="結果">結果</div><div class="n">2/4</div>
<div class="title h">カタールGP 決勝</div>
<div class="p1"><div class="num">1</div><div><div class="nm">選手名</div><div class="tm">チーム</div></div><div class="pt num">25</div></div>
<div class="rows">
 <div class="row"><span class="num">2</span><span class="nm">選手名</span><span class="pt num">20</span></div>
 <div class="row"><span class="num">3</span><span class="nm">選手名</span><span class="pt num">16</span></div>
 <div class="row jp"><span class="num">4</span><span class="nm">選手名</span><span class="pt num">13</span></div>
 <div class="row"><span class="num">5</span><span class="nm">選手名</span><span class="pt num">11</span></div>
 <div class="row"><span class="num">6</span><span class="nm">選手名</span><span class="pt num">10</span></div>
 <div class="row"><span class="num">7</span><span class="nm">選手名</span><span class="pt num">9</span></div>
 <div class="row"><span class="num">8</span><span class="nm">選手名</span><span class="pt num">8</span></div>
 <div class="row"><span class="num">9</span><span class="nm">選手名</span><span class="pt num">7</span></div>
 <div class="row"><span class="num">10</span><span class="nm">選手名</span><span class="pt num">6</span></div>
</div>
<div class="foot"><div class="logo"><span class="mark"><i></i><i></i></span>Eurogrid</div><div class="src">出典：MotoGP公式</div></div>
</body></html>
