<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><style>
/* note のプロフィールのヘッダー 1920×1006（960×503 を2倍で）。PCでは真ん中の横帯しか見えないので、中身は縦の中央に1行の帯でまとめる */
body{width:960px;height:503px;position:relative;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:30px}
.logo{font-size:52px}
.v{width:2px;height:80px;background:#3A3F47}
.copy{font-size:28px;font-weight:900;letter-spacing:.02em}
.sub{margin-top:6px;font-size:15px;color:var(--sub)}
.bars{position:absolute;left:0;right:0;top:50%;margin-top:62px;height:4px;display:flex;width:600px;left:180px}.bars .es{flex:1;background:linear-gradient(90deg,var(--es) 0 78%,var(--es2) 78%)}.bars .it{flex:1;background:linear-gradient(90deg,var(--it-stripe) 0 6%,var(--it) 6%)}
</style></head><body>
<div class="row"><div class="logo"><span class="mark"><i></i><i></i></span>Eurogrid</div><div class="v"></div><div><div class="copy">ふたつの視点、ひとつのグリッド。</div><div class="sub">スペインとイタリアのMotoGP報道を、レースごとに読み比べる</div></div></div>
<div class="bars"><div class="es"></div><div class="it"></div></div>
</body></html>
