<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:670px;background:#0d1522;font-family:"Noto Sans CJK JP",sans-serif;color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px}
.split{position:absolute;top:0;bottom:0;width:10px}
.es{left:0;background:linear-gradient(#c60b1e 0 25%,#ffc400 25% 75%,#c60b1e 75%)}
.it{right:0;background:linear-gradient(#009246 0 33.3%,#f1f2f1 33.3% 66.6%,#ce2b37 66.6%)}
.wrap{position:absolute;left:96px;right:96px;top:84px;bottom:72px;display:flex;flex-direction:column}
.tag{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:700;letter-spacing:.12em;color:#f5b301}
.tag .bar{width:44px;height:4px;background:#f5b301}
h1{margin-top:34px;font-size:82px;font-weight:900;line-height:1.18}
.sub{margin-top:28px;font-size:30px;font-weight:500;color:#c8d1de;line-height:1.5}
.sub b{color:#fff;font-weight:700}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.logo{display:flex;align-items:center;gap:16px;font-size:30px;font-weight:700;letter-spacing:.04em}
.mark{display:flex;gap:6px}
.mark i{display:block;width:26px;height:30px;border:6px solid #fff;border-bottom:none}
.mark i+i{border-color:#f5b301;margin-top:8px}
.race{font-size:22px;color:#8d9bb0;letter-spacing:.1em}
</style></head><body>
<div class="grid"></div><div class="split es"></div><div class="split it"></div>
<div class="wrap">
  <div class="tag"><span class="bar"></span>スペイン × イタリア 論調比較</div>
  <h1>王者が決まらなかった夜</h1>
  <div class="sub">スペインは<b>次の土曜</b>を数え、イタリアは<b>幻の日曜</b>を振り返った</div>
  <div class="foot">
    <div class="logo"><span class="mark"><i></i><i></i></span>Eurogrid</div>
    <div class="race">MotoGP 2026 ／ カタールGP</div>
  </div>
</div></body></html>
