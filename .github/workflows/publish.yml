name: Publish to Instagram
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = check only, do not post"
        default: "1"
      check_folder:
        description: "posts/<folder> to test (creates containers only, nothing is posted)"
        default: ""
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          CHECK_FOLDER: ${{ github.event.inputs.check_folder || '' }}
        run: |
          if [ -n "$CHECK_FOLDER" ]; then python3 scripts/publish.py --check "$CHECK_FOLDER"; else python3 scripts/publish.py; fi
      - name: Record published posts
        if: always()
        run: |
          git config user.name "eurogrid-bot"
          git config user.email "eurogrid-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Record published posts" && (git push || (git pull --rebase && git push)))
