name: Check Instagram token
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the token still works
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          t = os.environ["IG_ACCESS_TOKEN"]
          base = "https://graph.facebook.com/v23.0/"
          try:
              pages = json.load(urllib.request.urlopen(base + "me/accounts?fields=instagram_business_account&access_token=" + t, timeout=60))["data"]
              ids = [p["instagram_business_account"]["id"] for p in pages if p.get("instagram_business_account")]
              if not ids:
                  info = json.load(urllib.request.urlopen(base + "debug_token?input_token=" + t + "&access_token=" + t, timeout=60)).get("data", {})
                  ids = sorted({i for g in info.get("granular_scopes", []) if g.get("scope", "").startswith("instagram_") for i in g.get("target_ids", [])})
              if len(ids) != 1:
                  sys.exit(f"Instagram account lookup FAILED: found {len(ids)} account(s) for the token")
              r = json.load(urllib.request.urlopen(base + ids[0] + "?fields=username&access_token=" + t, timeout=60))
          except Exception as e:
              sys.exit("Token check FAILED (expired or revoked?): " + str(e).replace(t, "***"))
          print("Token OK for @" + r.get("username", "?"))
          PY
      - name: Check that the Threads token still works
        env:
          TH: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          t = os.environ.get("TH", "")
          if not t:
              print("THREADS_ACCESS_TOKEN not set yet; skipped"); sys.exit(0)
          url = "https://graph.threads.net/v1.0/me?fields=username&access_token=" + t
          try:
              r = json.load(urllib.request.urlopen(url, timeout=60))
          except Exception as e:
              sys.exit("Threads token check FAILED (expired or revoked?): " + str(e).replace(t, "***"))
          print("Threads token OK for @" + r.get("username", "?"))
          PY
